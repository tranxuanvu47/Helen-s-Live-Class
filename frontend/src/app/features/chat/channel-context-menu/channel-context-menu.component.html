<div
  class="ctx-menu"
  role="menu"
  [style.left.px]="x"
  [style.top.px]="y"
  (click)="$event.stopPropagation()"
>
  @if (!confirmDelete()) {
    <button class="ctx-menu__item" role="menuitem" (click)="onEdit()">
      <svg class="ctx-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Edit channel
    </button>

    <div class="ctx-menu__divider"></div>

    <button class="ctx-menu__item" role="menuitem" (click)="onHideToggle()">
      @if (isHidden) {
        <svg class="ctx-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Show channel
      } @else {
        <svg class="ctx-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        Hide channel
      }
    </button>

    <div class="ctx-menu__divider"></div>

    <button class="ctx-menu__item ctx-menu__item--danger" role="menuitem" (click)="onDeleteRequest()">
      <svg class="ctx-menu__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
        <path d="M10 11v6M14 11v6"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      </svg>
      Delete channel
    </button>
  } @else {
    <p class="ctx-menu__confirm-text">Delete this channel permanently?</p>
    <div class="ctx-menu__confirm-actions">
      <button class="ctx-menu__btn ctx-menu__btn--cancel" (click)="onDeleteCancel()">Cancel</button>
      <button class="ctx-menu__btn ctx-menu__btn--delete" (click)="onDeleteConfirm()">Delete</button>
    </div>
  }
</div>

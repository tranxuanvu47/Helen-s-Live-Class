<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Chat Widget – Demo</title>

  <!-- Widget styles (relative path when served from dist/widget/browser/) -->
  <link rel="stylesheet" href="./styles.css" />

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      gap: 24px;
    }

    h1 { font-size: 20px; margin: 0; color: #1a1a2e; }

    .widget-wrapper {
      width: 420px;
      height: 600px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }

    stream-chat-widget {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Stream Chat Widget – Local Demo</h1>

  <div class="widget-wrapper">
    <!--
      Attributes:
        channel-id  – ID of the Stream channel to open (required)
        user-id     – ID of the user (required)
        user-name   – Display name (optional, defaults to user-id)
        api-url     – Backend base URL (defaults to /api)
    -->
    <stream-chat-widget
      channel-id="general"
      user-id="alice"
      user-name="Alice"
      api-url="http://10.185.87.49:4300/api"
    ></stream-chat-widget>
  </div>

  <!-- Widget scripts (polyfills must load before main) -->
  <script type="module" src="./polyfills.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>

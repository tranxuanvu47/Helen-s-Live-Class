<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div class="modal" role="dialog" aria-labelledby="modal-title" aria-modal="true">
    <div class="modal__header">
      <h2 id="modal-title" class="modal__title">Create Channel</h2>
      <button class="icon-btn" (click)="close()" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="modal__body">
      <div class="form-field">
        <label for="ch-name">Channel Name <span class="required">*</span></label>
        <input
          id="ch-name"
          type="text"
          formControlName="name"
          placeholder="e.g. project-alpha"
        />
        @if (form.get('name')?.touched && form.get('name')?.errors?.['required']) {
          <span class="error-msg">Channel name is required.</span>
        }
      </div>

      <div class="form-field" style="margin-top: 16px">
        <label for="ch-desc">Description</label>
        <input
          id="ch-desc"
          type="text"
          formControlName="description"
          placeholder="What is this channel about?"
        />
      </div>

      <div class="form-field" style="margin-top: 16px">
        <label for="ch-members">Invite Members</label>
        <input
          id="ch-members"
          type="text"
          formControlName="members"
          placeholder="user1, user2, user3 (comma-separated user IDs)"
        />
        <span class="field-hint">Leave empty to create a private channel for yourself.</span>
      </div>

      @if (errorMessage()) {
        <div class="modal-error">{{ errorMessage() }}</div>
      }

      <div class="modal__footer">
        <button type="button" class="btn btn--ghost" (click)="close()">Cancel</button>
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="form.invalid || isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
          } @else {
            Create Channel
          }
        </button>
      </div>
    </form>
  </div>
</div>
